services:
  db:
    image: postgres:16-alpine
    container_name: portfolio_risk_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: portfolio_risk
    ports:
      - "5432:5432"
    volumes:
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d portfolio_risk"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: portfolio_risk_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/portfolio_risk
      RISK_FREE_RATE: 0.0
      TRADING_DAYS_PER_YEAR: 252
      DEFAULT_CONFIDENCE: 0.95
      APP_ENV: development
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
